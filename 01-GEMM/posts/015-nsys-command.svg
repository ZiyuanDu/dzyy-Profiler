<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
  <title id="title">An nsys command</title>
  <desc id="desc">Five color groups separate environment settings, tracing options, capture control, report output, and the Python program. Only the middle three groups are nsys options.</desc>
  <style>
    .heading { font: 700 32px 'DejaVu Sans', sans-serif; fill: #172338; }
    .label { font: 700 21px 'DejaVu Sans', sans-serif; }
    .hint { font: 600 13px 'DejaVu Sans', sans-serif; letter-spacing: 1.2px; }
    .code { font: 23px 'DejaVu Sans Mono', monospace; fill: #182335; }
    .command { font: 700 27px 'DejaVu Sans Mono', monospace; fill: #fff; }
    .options { font: 17px 'DejaVu Sans', sans-serif; fill: #64748b; }
  </style>

  <rect width="1200" height="810" rx="20" fill="#fff" />
  <text class="heading" x="40" y="58">An nsys command</text>

  <rect x="40" y="96" width="1120" height="104" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="40" y="96" width="7" height="104" rx="3.5" fill="#64748b" />
  <text class="label" x="64" y="141" fill="#475569">Environment</text>
  <text class="hint" x="64" y="169" fill="#64748b">TEMP FILES</text>
  <text class="code" x="260" y="155">TMPDIR=/tmp/nsys-"$USER" NSYS_TMPDIR=/tmp/nsys-"$USER"</text>

  <rect x="260" y="222" width="250" height="52" rx="11" fill="#172338" />
  <text class="command" x="283" y="257">nsys profile</text>
  <text class="options" x="535" y="255">options</text>
  <path d="M 235 304 H 222 V 620 H 235" fill="none" stroke="#cbd5e1" stroke-width="2" />

  <rect x="40" y="296" width="1120" height="104" rx="14" fill="#eff6ff" stroke="#b8d4ff" stroke-width="1.5" />
  <rect x="40" y="296" width="7" height="104" rx="3.5" fill="#2563eb" />
  <text class="label" x="64" y="341" fill="#1d4ed8">Trace</text>
  <text class="hint" x="64" y="369" fill="#3b6cbd">WHAT</text>
  <text class="code" x="260" y="355">--trace=cuda,nvtx --sample=none --cpuctxsw=none</text>

  <rect x="40" y="416" width="1120" height="110" rx="14" fill="#fff7ed" stroke="#fed0a5" stroke-width="1.5" />
  <rect x="40" y="416" width="7" height="110" rx="3.5" fill="#ea780c" />
  <text class="label" x="64" y="462" fill="#b45309">Capture</text>
  <text class="hint" x="64" y="490" fill="#b06a2d">WHEN</text>
  <text class="code" x="260" y="460">--capture-range=cudaProfilerApi</text>
  <text class="code" x="260" y="498">--capture-range-end=stop</text>

  <rect x="40" y="542" width="1120" height="86" rx="14" fill="#f0fdf4" stroke="#a4dfb9" stroke-width="1.5" />
  <rect x="40" y="542" width="7" height="86" rx="3.5" fill="#16a34a" />
  <text class="label" x="64" y="577" fill="#15803d">Output</text>
  <text class="hint" x="64" y="603" fill="#3d8a57">WHERE</text>
  <text class="code" x="260" y="592">-o profiles/gemm_1024</text>

  <rect x="40" y="644" width="1120" height="134" rx="14" fill="#f5f3ff" stroke="#d4c4fb" stroke-width="1.5" />
  <rect x="40" y="644" width="7" height="134" rx="3.5" fill="#7c3aed" />
  <text class="label" x="64" y="696" fill="#6d28d9">Program</text>
  <text class="hint" x="64" y="724" fill="#8760b8">RUN</text>
  <text class="code" x="260" y="696">.venv/bin/python 01-GEMM/01_profile_gemm.py</text>
  <text class="code" x="260" y="738">--shape 1024 1024 1024</text>
</svg>
